<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALLCON Central Dashboard</title>
    <!-- SVG Clipboard Dashboard Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d0f12'/><path d='M30 20 h40 v10 h-40 z' fill='%23e53935'/><rect x='25' y='25' width='50' height='60' rx='6' fill='none' stroke='%23f0f3f6' stroke-width='6'/><rect x='35' y='42' width='30' height='6' rx='3' fill='%23e53935'/><rect x='35' y='54' width='22' height='6' rx='3' fill='%23f0f3f6'/><rect x='35' y='66' width='26' height='6' rx='3' fill='%23f0f3f6'/></svg>">
    <style>
        :root {
            --bg-obsidian: #0d0f12;
            --card-bg: #14181d;
            --card-border: #232931;
            --card-hover: #2a313d;
            --allcon-red: #e53935;
            --allcon-red-hover: #f44336;
            --text-main: #f0f3f6;
            --text-muted: #9aa5b1;
            --category-tool: #388e3c;
            --category-db: #0288d1;
            --category-hub: #f57c00;
            --category-platform: #7b1fa2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-main);
            padding: 24px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--allcon-red);
            padding-bottom: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-img {
            max-width: 180px;
            height: auto;
            border-radius: 4px;
        }

        .welcome-text {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 520px;
            line-height: 1.4;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--card-hover);
        }

        .btn-primary {
            background-color: var(--allcon-red);
            border-color: var(--allcon-red);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--allcon-red-hover);
            border-color: var(--allcon-red-hover);
        }

        .btn-delete-mode {
            background-color: #2c1a1d;
            border-color: #5c2329;
            color: #ef5350;
        }

        .btn-delete-mode.active {
            background-color: var(--allcon-red);
            border-color: var(--allcon-red);
            color: #ffffff;
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 14px 10px 38px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--allcon-red);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .category-tabs {
            display: flex;
            gap: 6px;
            background-color: var(--card-bg);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid var(--card-border);
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--allcon-red);
            color: #ffffff;
        }

        /* Cards Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .tool-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 20px 16px 16px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            border-color: #3e4756;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .info-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .info-btn:hover {
            background-color: var(--allcon-red);
            color: #ffffff;
        }

        .icon-wrapper {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background-color: #090a0c;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            padding: 8px;
        }

        .icon-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .svg-icon {
            width: 36px;
            height: 36px;
        }

        .tool-title {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            line-height: 1.2;
            word-break: break-word;
        }

        .category-badge {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 10px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .badge-tool { background-color: rgba(56, 142, 60, 0.2); color: #81c784; border: 1px solid var(--category-tool); }
        .badge-db { background-color: rgba(2, 136, 209, 0.2); color: #4fc3f7; border: 1px solid var(--category-db); }
        .badge-hub { background-color: rgba(245, 124, 0, 0.2); color: #ffb74d; border: 1px solid var(--category-hub); }
        .badge-platform { background-color: rgba(123, 31, 162, 0.2); color: #ba68c8; border: 1px solid var(--category-platform); }

        .card-actions {
            width: 100%;
            margin-top: auto;
        }

        .launch-btn {
            width: 100%;
            background-color: #1f2630;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 8px 0;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .launch-btn:hover {
            background-color: var(--allcon-red);
            border-color: var(--allcon-red);
            color: #ffffff;
        }

        .delete-overlay-btn {
            width: 100%;
            background-color: #b71c1c;
            color: #ffffff;
            border: none;
            padding: 8px 0;
            border-radius: 6px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background-color: var(--card-bg);
            border: 1px dashed var(--card-border);
            border-radius: 10px;
        }

        /* Modal Styling */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            position: relative;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 18px;
            color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .external-link {
            color: #4fc3f7;
            text-decoration: none;
            font-size: 11px;
            text-transform: none;
        }

        .external-link:hover {
            text-decoration: underline;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            background-color: #090a0c;
            border: 1px solid var(--card-border);
            color: #ffffff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--allcon-red);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .auto-hint {
            font-size: 11px;
            color: #81c784;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <div class="header-left">
            <img class="logo-img" src="ALLCON-Logo.jpg" alt="ALLCON Logo" onerror="this.style.display='none'">
            <div class="welcome-text">
                Welcome to the Allcon dashboard where you will find all tools, databases and knowledge hubs.
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-delete-mode" id="btnDeleteMode" onclick="toggleDeleteMode()">
                🗑️ Delete Item
            </button>
            <button class="btn btn-primary" onclick="openSubmitModal()">
                ➕ Submit Item
            </button>
        </div>
    </header>

    <!-- Controls Bar -->
    <div class="controls-bar">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search tools, databases, hubs..." oninput="renderDashboard()">
        </div>
        <div class="category-tabs">
            <button class="tab-btn active" onclick="setCategoryFilter('ALL', this)">All Items</button>
            <button class="tab-btn" onclick="setCategoryFilter('Tool', this)">Tools</button>
            <button class="tab-btn" onclick="setCategoryFilter('Database', this)">Databases</button>
            <button class="tab-btn" onclick="setCategoryFilter('Knowledge Hub', this)">Knowledge Hubs</button>
            <button class="tab-btn" onclick="setCategoryFilter('Internal Platforms', this)">Internal Platforms</button>
        </div>
    </div>

    <!-- Cards Grid -->
    <div class="grid-container" id="cardsGrid">
        <!-- Dynamic Cards Inserted Here -->
    </div>
</div>

<!-- Submit / Edit Item Modal -->
<div class="modal-backdrop" id="submitModal">
    <div class="modal-card">
        <div class="modal-header">
            <span id="modalFormTitle">Submit Item to Dashboard</span>
            <button class="modal-close" onclick="closeSubmitModal()">&times;</button>
        </div>
        <form id="submitForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="editingItemId" value="">

            <div class="form-group">
                <label class="form-label">Item URL / Link *</label>
                <input type="url" id="itemUrl" class="form-input" placeholder="https://..." required onblur="autoDetectFields()">
            </div>

            <div class="form-group">
                <label class="form-label">Item Name *</label>
                <input type="text" id="itemName" class="form-input" placeholder="e.g. Arc & Ring Calculator" required>
            </div>

            <div class="form-group">
                <label class="form-label">Category *</label>
                <select id="itemCategory" class="form-select" required>
                    <option value="Tool">Tool</option>
                    <option value="Database">Database</option>
                    <option value="Knowledge Hub">Knowledge Hub</option>
                    <option value="Internal Platforms">Internal Platforms</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span>Icon Preset</span>
                    <span class="auto-hint" style="margin:0;">Recommended</span>
                </label>
                <select id="itemIconPreset" class="form-select">
                    <option value="AUTO">Auto Detect (Web Favicon / Category Default)</option>
                    <option value="calc">🧮 Calculator</option>
                    <option value="hub">📚 Knowledge Hub / Book</option>
                    <option value="db">🗄️ Database / Storage</option>
                    <option value="platform">💻 Platform / Application</option>
                    <option value="gear">⚙️ Settings / Utility</option>
                    <option value="chart">📊 Analytics / Chart</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <span>Custom Favicon Image URL (Optional)</span>
                    <a href="https://icon-sets.iconify.design/" target="_blank" class="external-link">Find Icons ↗</a>
                </label>
                <input type="url" id="itemIconUrl" class="form-input" placeholder="Paste direct image or SVG URL here">
            </div>

            <div class="form-group">
                <label class="form-label">Description (Optional)</label>
                <textarea id="itemDesc" class="form-textarea" placeholder="Brief explanation of what this tool does..."></textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="btn" style="flex:1;" onclick="closeSubmitModal()">Cancel</button>
                <button type="submit" class="btn btn-primary" style="flex:1;" id="btnFormSave">Save to Dashboard</button>
            </div>
        </form>
    </div>
</div>

<!-- Info Modal -->
<div class="modal-backdrop" id="infoModal">
    <div class="modal-card">
        <div class="modal-header">
            <span id="infoTitle">Item Details</span>
            <button class="modal-close" onclick="closeInfoModal()">&times;</button>
        </div>
        <div style="margin-bottom: 12px;">
            <span id="infoCategory" class="category-badge">Category</span>
        </div>
        <div style="color: var(--text-main); font-size: 14px; line-height: 1.5; margin-bottom: 20px;" id="infoDesc">
            No description provided.
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="flex: 1;" id="btnEditCurrentItem">✏️ Edit Item</button>
            <a id="infoLink" href="#" target="_blank" class="launch-btn" style="flex: 1.5;">
                Launch Tool ↗
            </a>
        </div>
    </div>
</div>

<script>
    let items = JSON.parse(localStorage.getItem('ALLCON_DASHBOARD_ITEMS')) || [];
    let deleteMode = false;
    let currentCategory = 'ALL';
    let currentActiveInfoId = null;

    // Vector Preset SVGs
    const presetSvgs = {
        'calc': `<svg class="svg-icon" viewBox="0 0 24 24" fill="#81c784"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm5 12H7v-1c0-1.67 3.33-2.5 5-2.5s5 .83 5 2.5v1z"/></svg>`,
        'hub': `<svg class="svg-icon" viewBox="0 0 24 24" fill="#ffb74d"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>`,
        'db': `<svg class="svg-icon" viewBox="0 0 24 24" fill="#4fc3f7"><path d="M12 2C6.48 2 2 3.79 2 6v12c0 2.21 4.48 4 10 4s10-1.79 10-4V6c0-2.21-4.48-4-10-4zm0 3c4.42 0 8 1.34 8 2s-3.58 2-8 2-8-1.34-8-2 3.58-2 8-2zm0 15c-4.42 0-8-1.34-8-2v-2.13c1.92 1.15 4.8 1.63 8 1.63s6.08-.48 8-1.63V18c0 .66-3.58 2-8 2z"/></svg>`,
        'platform': `<svg class="svg-icon" viewBox="0 0 24 24" fill="#ba68c8"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>`,
        'gear': `<svg class="svg-icon" viewBox="0 0 24 24" fill="#9aa5b1"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>`,
        'chart': `<svg class="svg-icon" viewBox="0 0 24 24" fill="#e53935"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>`
    };

    const categorySvgs = {
        'Tool': presetSvgs['calc'],
        'Database': presetSvgs['db'],
        'Knowledge Hub': presetSvgs['hub'],
        'Internal Platforms': presetSvgs['platform']
    };

    function autoDetectFields() {
        const urlInput = document.getElementById('itemUrl').value.toLowerCase();
        const categorySelect = document.getElementById('itemCategory');
        const presetSelect = document.getElementById('itemIconPreset');

        if (urlInput.includes('calc') || urlInput.includes('tool')) {
            categorySelect.value = 'Tool';
            if(presetSelect.value === 'AUTO') presetSelect.value = 'calc';
        } else if (urlInput.includes('sheet') || urlInput.includes('data') || urlInput.includes('table') || urlInput.includes('db')) {
            categorySelect.value = 'Database';
            if(presetSelect.value === 'AUTO') presetSelect.value = 'db';
        } else if (urlInput.includes('hub') || urlInput.includes('wiki') || urlInput.includes('doc')) {
            categorySelect.value = 'Knowledge Hub';
            if(presetSelect.value === 'AUTO') presetSelect.value = 'hub';
        }
    }

    function getFaviconUrl(item) {
        if (item.customIcon) return item.customIcon;
        try {
            return `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(item.url)}&sz=128`;
        } catch (e) {
            return '';
        }
    }

    function getCategoryBadgeClass(category) {
        switch(category) {
            case 'Tool': return 'badge-tool';
            case 'Database': return 'badge-db';
            case 'Knowledge Hub': return 'badge-hub';
            case 'Internal Platforms': return 'badge-platform';
            default: return 'badge-tool';
        }
    }

    function renderDashboard() {
        const grid = document.getElementById('cardsGrid');
        const search = document.getElementById('searchInput').value.toLowerCase();

        let filtered = items.filter(item => {
            const matchesSearch = item.name.toLowerCase().includes(search) || (item.desc && item.desc.toLowerCase().includes(search));
            const matchesCategory = currentCategory === 'ALL' || item.category === currentCategory;
            return matchesSearch && matchesCategory;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>No items found</h3>
                    <p style="margin-top: 6px; font-size: 13px;">Click "Submit Item" above to add your first tool to the dashboard.</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = filtered.map(item => {
            const iconUrl = getFaviconUrl(item);
            const badgeClass = getCategoryBadgeClass(item.category);
            
            // Choose vector fallback
            let vectorSvg = categorySvgs[item.category] || categorySvgs['Tool'];
            if (item.preset && item.preset !== 'AUTO' && presetSvgs[item.preset]) {
                vectorSvg = presetSvgs[item.preset];
            }

            const usePresetDirectly = item.preset && item.preset !== 'AUTO' && !item.customIcon;

            return `
                <div class="tool-card">
                    <button class="info-btn" onclick="openInfoModal('${item.id}')" title="Details & Edit">i</button>
                    
                    <div class="icon-wrapper">
                        ${usePresetDirectly ? vectorSvg : `
                            <img class="icon-img" src="${iconUrl}" alt="${item.name}" 
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                            <div style="display:none;">${vectorSvg}</div>
                        `}
                    </div>

                    <div class="tool-title">${item.name}</div>
                    <div class="category-badge ${badgeClass}">${item.category}</div>

                    <div class="card-actions">
                        ${deleteMode ? `
                            <button class="delete-overlay-btn" onclick="deleteItem('${item.id}')">
                                🗑️ Confirm Delete
                            </button>
                        ` : `
                            <a href="${item.url}" target="_blank" class="launch-btn">
                                Launch ↗
                            </a>
                        `}
                    </div>
                </div>
            `;
        }).join('');
    }

    function toggleDeleteMode() {
        deleteMode = !deleteMode;
        const btn = document.getElementById('btnDeleteMode');
        btn.classList.toggle('active', deleteMode);
        btn.innerHTML = deleteMode ? '⚠️ Exit Delete Mode' : '🗑️ Delete Item';
        renderDashboard();
    }

    function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        localStorage.setItem('ALLCON_DASHBOARD_ITEMS', JSON.stringify(items));
        renderDashboard();
    }

    function setCategoryFilter(category, btnElement) {
        currentCategory = category;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        renderDashboard();
    }

    /* Modal Handlers */
    function openSubmitModal(editItemId = null) {
        document.getElementById('editingItemId').value = editItemId || '';
        document.getElementById('modalFormTitle').innerText = editItemId ? 'Edit Dashboard Item' : 'Submit Item to Dashboard';
        document.getElementById('btnFormSave').innerText = editItemId ? 'Update Item' : 'Save to Dashboard';

        if (editItemId) {
            const item = items.find(i => i.id === editItemId);
            if (item) {
                document.getElementById('itemUrl').value = item.url;
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemCategory').value = item.category;
                document.getElementById('itemIconPreset').value = item.preset || 'AUTO';
                document.getElementById('itemIconUrl').value = item.customIcon || '';
                document.getElementById('itemDesc').value = item.desc || '';
            }
        }

        document.getElementById('submitModal').classList.add('active');
    }

    function closeSubmitModal() {
        document.getElementById('submitModal').classList.remove('active');
        document.getElementById('submitForm').reset();
        document.getElementById('editingItemId').value = '';
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        const editId = document.getElementById('editingItemId').value;
        const url = document.getElementById('itemUrl').value;
        const name = document.getElementById('itemName').value;
        const category = document.getElementById('itemCategory').value;
        const preset = document.getElementById('itemIconPreset').value;
        const customIcon = document.getElementById('itemIconUrl').value;
        const desc = document.getElementById('itemDesc').value;

        if (editId) {
            // Edit existing
            const index = items.findIndex(i => i.id === editId);
            if (index !== -1) {
                items[index] = { ...items[index], url, name, category, preset, customIcon, desc };
            }
        } else {
            // Create new
            const newItem = {
                id: 'item_' + Date.now(),
                url,
                name,
                category,
                preset,
                customIcon,
                desc
            };
            items.push(newItem);
        }

        localStorage.setItem('ALLCON_DASHBOARD_ITEMS', JSON.stringify(items));
        closeSubmitModal();
        if (currentActiveInfoId) closeInfoModal();
        renderDashboard();
    }

    function openInfoModal(id) {
        const item = items.find(i => i.id === id);
        if (!item) return;

        currentActiveInfoId = id;
        document.getElementById('infoTitle').innerText = item.name;
        document.getElementById('infoCategory').innerText = item.category;
        document.getElementById('infoCategory').className = `category-badge ${getCategoryBadgeClass(item.category)}`;
        document.getElementById('infoDesc').innerText = item.desc || 'No description provided for this item.';
        document.getElementById('infoLink').href = item.url;

        document.getElementById('btnEditCurrentItem').onclick = function() {
            closeInfoModal();
            openSubmitModal(id);
        };

        document.getElementById('infoModal').classList.add('active');
    }

    function closeInfoModal() {
        document.getElementById('infoModal').classList.remove('active');
        currentActiveInfoId = null;
    }

    renderDashboard();
</script>

</body>
</html>
